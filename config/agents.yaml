# Agent registry. The worker resolves `agent` on a task to an entry here.
#
# Shape of an entry:
#
#   lead_scoring:
#     module: agents.lead_scoring.agent      # must expose AGENT: Agent
#     enabled: true
#     concurrency: 2                          # max simultaneous runs
#     subscribes_to:                          # event types that create a task for this agent
#       - lead.enriched
#
# Timeouts, retries, tool allowlists, and approval requirements live in each
# agent's own manifest (agents/<name>/manifest.py) next to the code they govern,
# so an agent cannot be deployed without declaring them. This file controls
# wiring: what is turned on and what it listens to.
#
agents:
  chief_of_staff:
    module: agents.chief_of_staff.agent
    enabled: true
    concurrency: 1
    subscribes_to: []

  opportunity_discovery:
    module: agents.opportunity_discovery.agent
    enabled: true
    concurrency: 1
    subscribes_to: []

  lead_discovery:
    module: agents.lead_discovery.agent
    enabled: true
    concurrency: 1
    subscribes_to:
      - opportunity.discovered

  lead_enrichment:
    module: agents.lead_enrichment.agent
    enabled: true
    concurrency: 2
    subscribes_to:
      - lead.discovered

  lead_scoring:
    module: agents.lead_scoring.agent
    enabled: true
    concurrency: 2
    subscribes_to:
      - lead.enriched

  outreach:
    module: agents.outreach.agent
    enabled: true
    concurrency: 2
    subscribes_to:
      - lead.scored

  conversation_management:
    module: agents.conversation_management.agent
    enabled: true
    concurrency: 1
    # No event subscription: there is no periodic-polling mechanism in this system yet,
    # so checking the inbox is a CEO command ("check for replies"), not something that
    # happens on a schedule. It fires once for outreach replies and again, later, for
    # proposal replies — the same command, run again once there's something to fetch.
    subscribes_to: []

  qualification:
    module: agents.qualification.agent
    enabled: true
    concurrency: 2
    subscribes_to:
      - conversation.reply_received

  sales:
    module: agents.sales.agent
    enabled: true
    concurrency: 2
    subscribes_to:
      - deal.qualified
      - proposal.reply_received

  proposal:
    module: agents.proposal.agent
    enabled: true
    concurrency: 2
    subscribes_to:
      - deal.ready_for_proposal

  customer:
    module: agents.customer.agent
    enabled: true
    concurrency: 1
    subscribes_to:
      - deal.won

# Fulfillment, Customer Success, Finance, Marketing, and Analytics don't exist yet. A CEO
# command needing one of them reports BLOCKED honestly rather than pretending to dispatch.
