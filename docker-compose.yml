services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: mybusiness
      POSTGRES_PASSWORD: mybusiness_dev
      POSTGRES_DB: mybusiness
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mybusiness"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
