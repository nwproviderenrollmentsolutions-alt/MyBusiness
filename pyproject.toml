[project]
name = "mybusiness"
version = "0.1.0"
description = "AI-native one-person company operating system"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.1.18",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0.1",
    "anthropic>=0.49.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-PyYAML>=6.0.12",
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["config", "core", "db", "providers", "agents", "api", "worker", "cli", "ugc_cloner"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Alembic writes these; they are a record of what ran, not code we hand-maintain.
extend-exclude = ["db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
# B008: FastAPI's Depends() in defaults is the documented pattern.
# N818: exception names read better as PolicyViolation than PolicyViolationError.
ignore = ["B008", "N818"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Application code is strictly typed. Tests are asserted behavior, not a public API, and
# annotating every fixture adds noise without catching bugs. Covers both tests/ and each
# agent's own agents/<name>/tests/ package.
module = ["tests.*", "agents.*.tests.*", "ugc_cloner.tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
check_untyped_defs = false

[tool.pytest.ini_options]
# Cross-cutting infra tests live under tests/; each agent's own tests live next to its
# code in agents/<name>/tests/, per the per-agent package layout in ARCHITECTURE.md.
# ugc_cloner/tests/ is a third location: that package is filesystem-based and has no
# database dependency, so its tests need no Postgres and no `-m integration` marker.
testpaths = ["tests", "agents", "ugc_cloner"]
markers = [
    "integration: requires a live Postgres database",
]
filterwarnings = ["error::DeprecationWarning:mybusiness.*"]
